name: Build SLIFX AI Editor APK
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          test -f "SLIFX-AI-Editor-v0.5.0-TESTE.zip"
          unzip -o "SLIFX-AI-Editor-v0.5.0-TESTE.zip" -d .
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Force Kotlin 2.2.10 and verify declarations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          excluded = {".gradle", "build", ".git"}
          files = [
              p for p in Path(".").rglob("*")
              if p.is_file()
              and p.suffix.lower() in {".gradle", ".kts", ".toml", ".properties"}
              and not any(part in excluded for part in p.parts)
          ]

          changed = []
          for p in files:
              try:
                  original = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              output = []
              for line in original.splitlines(keepends=True):
                  # Match kotlinVersion, kotlin_version, plugin IDs, aliases and coordinates.
                  if "kotlin" in line.lower():
                      line = re.sub(
                          r"(?<![\w.])2\.0\.\d+(?!\d)",
                          "2.2.10",
                          line
                      )
                  line = line.replace("8.7.3", "8.10.0")
                  line = line.replace("8.10.1", "8.10.0")
                  line = re.sub(
                      r"(compileSdk(?:Version)?\s*(?:=\s*)?)35\b",
                      r"\g<1>36",
                      line
                  )
                  output.append(line)

              updated = "".join(output)
              if updated != original:
                  p.write_text(updated, encoding="utf-8")
                  changed.append(str(p))

          print("Arquivos alterados:", ", ".join(changed) if changed else "nenhum")

          stale = []
          pins = []
          for p in files:
              try:
                  content = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for n, line in enumerate(content.splitlines(), 1):
                  if "kotlin" in line.lower():
                      if re.search(r"(?<![\w.])2\.0\.\d+(?!\d)", line):
                          stale.append(f"{p}:{n}: {line.strip()}")
                      if "2.2.10" in line:
                          pins.append(f"{p}:{n}: {line.strip()}")

          print("Declarações Kotlin encontradas:")
          for p in files:
              try:
                  content = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for n, line in enumerate(content.splitlines(), 1):
                  if "kotlin" in line.lower():
                      print(f"{p}:{n}: {line.strip()}")

          if stale:
              print("ERRO: ainda há versões Kotlin 2.0.x:")
              print("\n".join(stale))
              sys.exit(1)
          if not pins:
              print("ERRO: não foi possível confirmar uma declaração Kotlin 2.2.10.")
              sys.exit(1)

          sdk35 = []
          for p in files:
              try:
                  content = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for n, line in enumerate(content.splitlines(), 1):
                  if re.search(r"compileSdk(?:Version)?\s*(?:=\s*)?35\b", line):
                      sdk35.append(f"{p}:{n}: {line.strip()}")
          if sdk35:
              print("ERRO: compileSdk 35 ainda presente:")
              print("\n".join(sdk35))
              sys.exit(1)

          print("OK: Kotlin 2.2.10 e compileSdk 36 verificados.")
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SLIFX-AI-Editor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
