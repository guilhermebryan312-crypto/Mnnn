name: Build SLIFX AI Editor APK
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          test -f "SLIFX-AI-Editor-v0.5.0-TESTE.zip"
          unzip -o "SLIFX-AI-Editor-v0.5.0-TESTE.zip" -d .
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Align Android and Kotlin versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          excluded = {".gradle", "build", ".git"}
          files = [
              p for p in Path(".").rglob("*")
              if p.is_file()
              and p.suffix.lower() in {".gradle", ".kts", ".toml", ".properties"}
              and not any(part in excluded for part in p.parts)
          ]

          for p in files:
              try:
                  original = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              s = original

              # AGP 8.10.0 is compatible with Kotlin Gradle Plugin 2.2.10.
              s = s.replace("8.7.3", "8.10.0")
              s = s.replace("8.10.1", "8.10.0")

              # Update explicit Kotlin plugin/version-catalog declarations.
              s = re.sub(
                  r'((?:org\.jetbrains\.kotlin(?:\.android|\.jvm|\.plugin\.compose)?|kotlin)\s*(?:[=:]\s*|"\s*version\s*")["\']?)2\.0\.\d+',
                  r'\g<1>2.2.10',
                  s
              )
              s = re.sub(
                  r'(kotlin\s*=\s*["\'])2\.0\.\d+(["\'])',
                  r'\g<1>2.2.10\2',
                  s
              )
              s = re.sub(
                  r'(kotlinVersion\s*=\s*["\'])2\.0\.\d+(["\'])',
                  r'\g<1>2.2.10\2',
                  s
              )

              # Raise compile SDK declarations from 35 to 36.
              s = re.sub(r'(compileSdk(?:Version)?\s*(?:=\s*)?)35\b', r'\g<1>36', s)

              if s != original:
                  p.write_text(s, encoding="utf-8")
                  print(f"Updated {p}")

          # Print Kotlin/AGP declarations for diagnosis and fail if old Kotlin remains explicit.
          for p in files:
              try:
                  s = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if re.search(r'(?i)(kotlin|org\.jetbrains\.kotlin)[^\n]{0,100}2\.0\.\d+', s):
                  print(f"WARNING: possible old Kotlin version remains in {p}")
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SLIFX-AI-Editor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
